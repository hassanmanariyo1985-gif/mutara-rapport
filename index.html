<style>
:root{--bg:#f4f7f2;--fg:#17261a;--card:#fff;--line:#d5e0d2;--acc:#2e7d32;--accfg:#fff;--mut:#5a6d5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
nav{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--line);flex:none;-webkit-overflow-scrolling:touch}
.tab{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#home{position:absolute;inset:0;overflow:auto;padding:20px 16px}
h1{margin:0 0 4px;font-size:24px;color:var(--acc)}
.sub{margin:0 0 18px;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:900px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;font:inherit}
.card .ic{font-size:28px}.card b{font-size:15px}.card small{color:var(--mut);font-size:12px}
.top{flex:none;padding:10px 14px 2px;background:var(--card);font-size:20px;font-weight:800;color:var(--acc)}
.ybar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.ybar button{flex:none;padding:8px 12px;border:0;border-radius:999px;background:var(--acc);color:var(--accfg);font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.ybar button:disabled{opacity:.6}
#ystat{font-size:12px;color:var(--mut);min-width:0;word-break:break-word}
.syn{max-width:900px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.syn button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.syn button:disabled{opacity:.6}
#ylist{margin:10px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.6}
#ylist li{word-break:break-word}
.grid{display:none!important}
.srch{max-width:900px;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.srch label{display:block;font-weight:800;font-size:14px;color:var(--acc);margin-bottom:8px}
.srch input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
#sinfo{margin:8px 0 0;font-size:12px;color:var(--mut)}
#sres{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hit{text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.hit b{display:block;font-size:12px;color:var(--acc);margin-bottom:3px}
.hit span{display:block;font-size:13px;line-height:1.4;word-break:break-word}
[hidden]{display:none!important}

function walk(o,app,toks,out,depth){
  if(!o||typeof o!=="object"||depth>8||out.length>=80)return 0;
  var found=0,ks=Object.keys(o);
  ks.forEach(function(k){var v=o[k];if(v&&typeof v==="object")found+=walk(v,app,toks,out,depth+1)});
